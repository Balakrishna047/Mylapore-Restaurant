openapi: 3.1.0
info:
  title: Mylapore Express API
  version: 1.0.0
  description: >
    Contract baseline. Implementations must preserve server-side authority,
    ownership checks, idempotency and state-transition validation.
servers:
  - url: https://{apiHost}/api/v1
    variables:
      apiHost:
        default: api.example.invalid
security:
  - SessionCookie: []
tags:
  - name: Catalog
  - name: Cart
  - name: Checkout
  - name: Orders
  - name: Agent
  - name: Operations
  - name: Admin
  - name: Webhooks
paths:
  /outlets:
    get:
      tags: [Catalog]
      security: []
      summary: List active outlets
      responses:
        "200":
          description: Active outlets
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Outlet"}
  /outlets/{outletId}/menu:
    get:
      tags: [Catalog]
      security: []
      summary: Get outlet menu
      parameters:
        - {$ref: "#/components/parameters/OutletId"}
        - name: categoryId
          in: query
          schema: {type: string, format: uuid}
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - name: availableOnly
          in: query
          schema: {type: boolean, default: true}
      responses:
        "200":
          description: Menu
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/MenuItem"}
                  meta: {$ref: "#/components/schemas/ResponseMeta"}
  /cart:
    get:
      tags: [Cart]
      summary: Get current principal cart
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}
    post:
      tags: [Cart]
      summary: Add item to current principal cart
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AddCartItem"}
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}
        "409": {$ref: "#/components/responses/Conflict"}
  /cart/items/{cartItemId}:
    patch:
      tags: [Cart]
      summary: Update cart item quantity or modifiers
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: {type: integer, minimum: 1, maximum: 50}
                modifierIds:
                  type: array
                  items: {type: string, format: uuid}
      responses:
        "200": {description: Updated cart, content: {application/json: {schema: {$ref: "#/components/schemas/Cart"}}}}
    delete:
      tags: [Cart]
      summary: Remove cart item
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Removed}
  /checkout/quote:
    post:
      tags: [Checkout]
      summary: Validate cart and create expiring authoritative quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outletId, fulfilmentType]
              properties:
                outletId: {type: string, format: uuid}
                fulfilmentType: {type: string, enum: [DELIVERY, PICKUP]}
                addressId: {type: string, format: uuid}
                requestedSlotId: {type: string, format: uuid}
                couponCode: {type: string, maxLength: 40}
      responses:
        "201":
          description: Quote
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quote"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /checkout/orders:
    post:
      tags: [Checkout]
      summary: Confirm quote and create pending order
      description: Does not mark an online payment as successful. Requires explicit customer confirmation.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId, acceptedTerms]
              properties:
                quoteId: {type: string, format: uuid}
                acceptedTerms: {type: boolean, const: true}
                customerNote: {type: string, maxLength: 500}
      responses:
        "201":
          description: Pending order and payment instruction
          content:
            application/json:
              schema:
                type: object
                required: [order, payment]
                properties:
                  order: {$ref: "#/components/schemas/Order"}
                  payment:
                    type: object
                    properties:
                      provider: {type: string, example: stripe}
                      clientSecret: {type: string}
                      paymentId: {type: string}
        "409": {$ref: "#/components/responses/Conflict"}
  /orders:
    get:
      tags: [Orders]
      summary: List orders owned by current principal
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/Order"}}
                  nextCursor: {type: [string, "null"]}
  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get owned order details
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: Order, content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Request cancellation under policy
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirm]
              properties:
                reason: {type: string, maxLength: 300}
                confirm: {type: boolean, const: true}
      responses:
        "200": {description: Cancellation decision, content: {application/json: {schema: {$ref: "#/components/schemas/ActionResult"}}}}
        "409": {$ref: "#/components/responses/Conflict"}
  /orders/{orderId}/reschedule:
    post:
      tags: [Orders]
      summary: Request a new fulfilment slot
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotId, confirm]
              properties:
                slotId: {type: string, format: uuid}
                confirm: {type: boolean, const: true}
      responses:
        "200": {description: Reschedule result, content: {application/json: {schema: {$ref: "#/components/schemas/ActionResult"}}}}
  /orders/{orderId}/payment:
    get:
      tags: [Orders]
      summary: Read payment status for owned order
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: Payment status, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentStatus"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /agent/sessions:
    post:
      tags: [Agent]
      summary: Create server-side Agentforce chat session
      description: Authenticated by browser session. Identity token is server-created and never supplied by the model.
      responses:
        "201":
          description: Session bootstrap
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, expiresAt, launchContext]
                properties:
                  sessionId: {type: string, format: uuid}
                  expiresAt: {type: string, format: date-time}
                  launchContext: {type: object, additionalProperties: true}
  /agent/menu-search:
    post:
      tags: [Agent]
      security: [{AgentSessionToken: []}]
      summary: Search current menu for agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outletId]
              properties:
                outletId: {type: string, format: uuid}
                query: {type: string, maxLength: 100}
                maxPriceMinor: {type: integer, minimum: 0}
                dietaryLabel: {type: string}
                categoryId: {type: string, format: uuid}
      responses:
        "200": {description: Verified menu results, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/MenuItem"}}}}}
  /agent/cart-add:
    post:
      tags: [Agent]
      security: [{AgentSessionToken: []}]
      summary: Add a verified menu item to principal cart
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AddCartItem"}
      responses:
        "200": {description: Updated authoritative cart, content: {application/json: {schema: {$ref: "#/components/schemas/Cart"}}}}
  /agent/order-status:
    post:
      tags: [Agent]
      security: [{AgentSessionToken: []}]
      summary: Retrieve order status owned by signed session principal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderReference]
              properties:
                orderReference: {type: string, maxLength: 80}
      responses:
        "200": {description: Order status, content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /webhooks/stripe:
    post:
      tags: [Webhooks]
      security: []
      summary: Receive Stripe webhook
      description: Verify signature against raw body; deduplicate event ID; validate amount/currency/reference.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200": {description: Event accepted or already processed}
        "400": {description: Invalid signature or malformed event}
  /admin/menu-items:
    post:
      tags: [Admin]
      summary: Create menu item
      description: Requires menu-management permission and outlet scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MenuItemWrite"}
      responses:
        "201": {description: Created}
  /operations/orders/{orderId}/kitchen:
    post:
      tags: [Operations]
      summary: Record kitchen transition
      description: Staff role and outlet scope required. State machine validates transition.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: {type: string, enum: [ACCEPT, REJECT, START_PREPARING, MARK_READY]}
                reason: {type: string, maxLength: 300}
      responses:
        "200": {description: Updated order}
        "409": {$ref: "#/components/responses/Conflict"}
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: me_session
    AgentSessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OutletId:
      name: outletId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
  responses:
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ValidationError:
      description: Business validation failed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Resource unavailable or not owned by caller
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    ResponseMeta:
      type: object
      properties:
        generatedAt: {type: string, format: date-time}
        outletId: {type: string, format: uuid}
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: {type: integer, minimum: 0, description: Integer minor units, e.g. paise for INR}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
    Outlet:
      type: object
      required: [id, name, timezone, isOpen]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        timezone: {type: string, example: Asia/Kolkata}
        isOpen: {type: boolean}
    MenuItem:
      type: object
      required: [id, name, price, available]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        imageUrl: {type: [string, "null"], format: uri}
        price: {$ref: "#/components/schemas/Money"}
        dietaryLabels: {type: array, items: {type: string}}
        allergenLabels: {type: array, items: {type: string}}
        ingredients: {type: array, items: {type: string}}
        available: {type: boolean}
        preparationMinutes: {type: integer, minimum: 0}
    AddCartItem:
      type: object
      required: [outletId, menuItemId, quantity]
      properties:
        outletId: {type: string, format: uuid}
        menuItemId: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 50}
        modifierIds: {type: array, items: {type: string, format: uuid}}
        specialInstructions: {type: string, maxLength: 250}
    Cart:
      type: object
      required: [id, lines, total, version]
      properties:
        id: {type: string, format: uuid}
        lines: {type: array, items: {type: object, additionalProperties: true}}
        subtotal: {$ref: "#/components/schemas/Money"}
        total: {$ref: "#/components/schemas/Money"}
        version: {type: integer}
        expiresAt: {type: [string, "null"], format: date-time}
    Quote:
      type: object
      required: [id, expiresAt, subtotal, total, currency]
      properties:
        id: {type: string, format: uuid}
        expiresAt: {type: string, format: date-time}
        subtotal: {type: integer, minimum: 0}
        discount: {type: integer, minimum: 0}
        tax: {type: integer, minimum: 0}
        deliveryFee: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        currency: {type: string, example: INR}
        lines: {type: array, items: {type: object, additionalProperties: true}}
    Order:
      type: object
      required: [id, reference, orderStatus, paymentStatus, fulfilmentType, total, createdAt]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string}
        orderStatus: {type: string}
        paymentStatus: {type: string}
        refundStatus: {type: [string, "null"]}
        deliveryStatus: {type: [string, "null"]}
        fulfilmentType: {type: string, enum: [DELIVERY, PICKUP]}
        total: {$ref: "#/components/schemas/Money"}
        createdAt: {type: string, format: date-time}
        estimatedReadyAt: {type: [string, "null"], format: date-time}
    PaymentStatus:
      type: object
      required: [status, amount, currency]
      properties:
        status: {type: string}
        amount: {type: integer}
        currency: {type: string}
        lastUpdatedAt: {type: string, format: date-time}
    ActionResult:
      type: object
      required: [accepted, message, resultingStatus]
      properties:
        accepted: {type: boolean}
        message: {type: string}
        resultingStatus: {type: string}
    MenuItemWrite:
      type: object
      required: [outletId, name, priceMinor, currency]
      properties:
        outletId: {type: string, format: uuid}
        name: {type: string, minLength: 2, maxLength: 120}
        description: {type: string, maxLength: 1000}
        priceMinor: {type: integer, minimum: 0}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        available: {type: boolean, default: true}
    Error:
      type: object
      required: [code, message, correlationId]
      properties:
        code: {type: string}
        message: {type: string}
        correlationId: {type: string}
        details: {type: object, additionalProperties: true}
