<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F0"/>
      <stop offset="100%" stop-color="#F4EADB"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D95338"/>
      <stop offset="100%" stop-color="#B53F28"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative circular pattern -->
  <circle cx="200" cy="140" r="70" fill="none" stroke="#E7DFD5" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="200" cy="140" r="54" fill="#FBF3E6" stroke="#E7DFD5" stroke-width="1.5"/>

  <!-- Steaming Brass Bowl / Culinary Motif -->
  <g transform="translate(165, 105)">
    <!-- Steam Lines -->
    <path d="M25 5 Q28 0 25 -5" fill="none" stroke="#D95338" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M35 8 Q38 2 35 -3" fill="none" stroke="#D95338" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M45 5 Q48 0 45 -5" fill="none" stroke="#D95338" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Bowl -->
    <path d="M10 25 Q10 55 35 55 Q60 55 60 25 Z" fill="url(#terracotta)"/>
    <ellipse cx="35" cy="25" rx="25" ry="7" fill="#E6684E"/>
    <ellipse cx="35" cy="25" rx="21" ry="5" fill="#FAF4E8"/>
    <!-- Bowl Base -->
    <rect x="27" y="55" width="16" height="4" rx="2" fill="#B53F28"/>
  </g>

  <!-- Mylapore Heritage Label -->
  <text x="200" y="225" font-family="serif" font-size="14" font-weight="bold" fill="#78716C" text-anchor="middle" letter-spacing="1">MYLAPORE EXPRESS</text>
  <text x="200" y="242" font-family="sans-serif" font-size="11" fill="#A8A29E" text-anchor="middle">Authentic South Indian Culinary</text>
</svg>
