services:
  # ===============================================
  # Mylapore Express - NestJS Backend Web Service
  # ===============================================
  - type: web
    name: mylapore-express-api
    env: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm build:api && pnpm db:push:pg && pnpm db:seed
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SALESFORCE_ENABLED
        value: "true"
      - key: SALESFORCE_INSTANCE_URL
        value: "https://orgfarm-aa5be92666-dev-ed.develop.my.salesforce.com"
      - key: SALESFORCE_AGENT_ID
        value: "0XxgK000002YIJ7SAO"
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false

  # ===============================================
  # Mylapore Express - Next.js Frontend Web Service
  # ===============================================
  - type: web
    name: mylapore-express-web
    env: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm build:web
    startCommand: pnpm --filter @mylapore/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_URL
        value: https://mylapore-express-api.onrender.com
